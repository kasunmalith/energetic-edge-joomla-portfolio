COM_TAGZ_DOWNLOAD_ID_DESC = "Enter your Download ID to enable automatic updates of TAGZ. You can find your download ID when you log into your account on roosterz.nl. Please check the manual for more info."
COM_TAGZ_PRIORITY_CONFLICT = "Priority when conflict between Component TAG / Menu Item TAG"
COM_TAGZ_PRIORITY_CONFLICT_DESC = "For any page there can be a situation that a TAG has been created using a Menu Item AND one using the particular Component (e.g. K2 or Virtuemart). When this happens please choose what will prevail. Default: The TAG that has been defined using the Component. If you are not sure what this does, please leave it to the default value."
COM_TAGZ_REMOVE_OTHER_TAGS = "Remove TAGS created by other extensions?"
COM_TAGZ_REMOVE_OTHER_TAGS_DESC = "Enable this option to automatically remove other Open Graph or Twitter Card TAGS, created by other extensions or template."
COM_TAGZ_AUTO_FETCH_TAGS = "Automatic TAG Fetching"
COM_TAGZ_AUTO_FETCH_TAGS_DESC = "Do you want TAGZ to automatically fetch TAGS of your content? In case of issues please disable this."
COM_TAGS_MOVE_TO_END_OF_HEAD = "Move TAGS to end of HEAD"
COM_TAGS_MOVE_TO_END_OF_HEAD_DESC = "By default the Open Graph tags and Twitter Cards are placed right after the HEAD tag in order for the social networks to properly pick them up. If you need to move them to the end of the HEAD please do so here. If you don't know what you are doing please leave it by default."
COM_TAGZ_REMOVE_PLUGIN_SHORTCODES = "Remove inserted shortcodes (enable only if there are issues)"
COM_TAGZ_REMOVE_PLUGIN_SHORTCODES_DESC = "Some plugins insert shortcodes (like {ampz:test}) to get additional functionality in content. This might interfere with TAGZ. If you know you have shortcodes inserted in your content and have issues with TAGZ please enable this option."
COM_TAGZ_LOCK_TAG_QUESTION = "Lock Tag?"
