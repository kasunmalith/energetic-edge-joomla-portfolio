COM_TAGZ_MENU_ITEMS_MANUALLY = "TAGZ offers functionality to automatically fetch the title, description and image from the item itself. Unfortunately, Open Graph tags and Twitter Cards for Menu Items cannot be fetched automatically since in many cases there is no direct relation between the menu item and the 'thing' it points to. Please click the Menu Titles below that you would like to edit."
