COM_TAGZ_GET_TAG_INFO_DESC = "By clicking the button TAGZ tries to fetch the meta information from the item. If the item is locked, it is not possible to get the info."
COM_TAGZ_GET_TAG_INFO_NOTE = "TAGZ offers functionality to automatically fetch the title, description and image from the item itself. If the item is not locked by the button above you can click the green button below to fetch the info."
